<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#172033">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <title>Medicine Reminder</title>
</head>

<body>

    <main class="app">

        <!-- Header -->

        <header>

            <div>
                <p class="eyebrow" data-i18n="eyebrow">MY HEALTH</p>
                <h1 data-i18n="appTitle">Medicine Reminder</h1>
            </div>

            <div class="header-actions">
                <button
                    id="languageToggle"
                    class="language-btn"
                    type="button"
                    aria-label="Switch language to Bangla">
                    বাংলা
                </button>

                <div class="notification-control">
                    <button
                        id="notifyBtn"
                        class="icon-btn"
                        type="button"
                        aria-label="Enable notifications"
                        title="Enable notifications">
                        🔔
                    </button>
                    <span class="notification-hint">
                        <span data-i18n="notificationHintLine1">Tap 🔔 to allow</span>
                        <span data-i18n="notificationHintLine2">notification</span>
                    </span>
                </div>
            </div>

        </header>


        <!-- Today's Summary -->

        <section class="hero">

            <div>

                <p id="today"></p>

                <h2 data-i18n="todaysMedicines">Today's Medicines</h2>

            </div>

            <div id="count" class="count">
                0
            </div>

        </section>


        <!-- Medicine List -->

        <section
            id="medicineList"
            class="medicine-list">
        </section>


        <!-- Add Button -->

        <button
            id="addBtn"
            class="add-btn">

            <span data-i18n="addMedicine">＋ Add Medicine</span>

        </button>


        <p class="note">
            <span data-i18n="disclaimer">This app only reminds you about medicines you enter. It does not provide medical advice.</span>
            <br>
            <span data-i18n="developedBy">Developed by</span>
            <a
                href="https://mohammadashfak.vercel.app/"
                target="_blank"
                rel="noopener noreferrer">Ashfak</a>
        </p>

    </main>



    <!-- Add Medicine Modal -->

    <div
        id="modal"
        class="modal hidden">

        <div class="modal-card">


            <div class="modal-head">

                <h2 data-i18n="modalAddMedicine">Add Medicine</h2>

                <button
                    id="closeBtn"
                    class="close-btn"
                    type="button"
                    aria-label="Close"
                    title="Close">

                    ×

                </button>

            </div>



            <form id="medicineForm">


                <!-- Medicine Name -->

                <label>

                    <span data-i18n="medicineName">Medicine Name</span>

                    <input
                        id="name"
                        type="text"
                        placeholder="e.g. Napa"
                        data-i18n-placeholder="medicineNamePlaceholder"
                        required>

                </label>



                <!-- Dosage -->

                <label>

                    <span data-i18n="dosage">Dosage</span>

                    <input
                        id="dosage"
                        type="text"
                        placeholder="e.g. 1 tablet"
                        data-i18n-placeholder="dosagePlaceholder"
                        required>

                </label>



                <!-- Times per day -->

                <label>

                    <span data-i18n="timesPerDay">How many times a day?</span>

                    <select id="timesPerDay">

                        <option value="1" data-i18n="oneTime">
                            1 time
                        </option>

                        <option value="2" data-i18n="twoTimes">
                            2 times
                        </option>

                        <option value="3" data-i18n="threeTimes">
                            3 times
                        </option>

                        <option value="4" data-i18n="fourTimes">
                            4 times
                        </option>

                    </select>

                </label>



                <!-- Dose Times -->

                <div class="dose-section">

                    <h3 data-i18n="doseTimes">Dose Times</h3>

                    <div id="doseTimes"></div>

                </div>



                <!-- Meal Timing -->

                <label>

                    <span data-i18n="whenToTake">When to take?</span>

                    <select id="mealTiming">

                        <option value="any" data-i18n="anyTime">
                            Any time
                        </option>

                        <option value="before" data-i18n="beforeMeal">
                            🍽️ Before meal
                        </option>

                        <option value="after" data-i18n="afterMeal">
                            🍽️ After meal
                        </option>

                        <option value="with" data-i18n="withMeal">
                            🍽️ With meal
                        </option>

                    </select>

                </label>



                <!-- Repeat -->

                <div class="repeat-section">

                    <h3 data-i18n="repeat">Repeat</h3>

                    <label class="repeat-option">

                        <input
                            type="radio"
                            name="repeatType"
                            value="days"
                            checked>

                        <span data-i18n="repeatDaysQuestion">For how many days?</span>

                    </label>

                    <div class="days-input">

                        <input
                            id="repeatDays"
                            type="number"
                            min="1"
                            placeholder="7">

                        <span data-i18n="days">Days</span>

                    </div>

                    <label class="repeat-option">

                        <input
                            type="radio"
                            name="repeatType"
                            value="until">

                        <span data-i18n="untilStopped">Until I stop it</span>

                    </label>

                </div>



                <!-- Notes -->

                <label>

                    <span data-i18n="notes">Notes</span>

                    <textarea
                        id="notes"
                        placeholder="e.g. Drink with plenty of water"
                        data-i18n-placeholder="notesPlaceholder">
                    </textarea>

                </label>



                <!-- Save -->

                <button
                    type="submit"
                    class="save-btn">

                    <span data-i18n="saveMedicine">Save Medicine</span>

                </button>


            </form>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
